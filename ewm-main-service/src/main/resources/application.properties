server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:main}}
spring.datasource.username=${DB_USER:main}
spring.datasource.password=${DB_PASSWORD:main}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
stats-server.url=${STATS_SERVER_URL:http://localhost:9090}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
