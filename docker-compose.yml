services:
  main-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ${MAIN_DB_NAME:-main}
      POSTGRES_USER: ${MAIN_DB_USER:-main}
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD:-main}
    volumes:
      - main-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  ewm-service:
    build:
      context: .
      dockerfile: ewm-main-service/Dockerfile
    ports:
      - "${MAIN_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: main-db
      DB_PORT: 5432
      DB_NAME: ${MAIN_DB_NAME:-main}
      DB_USER: ${MAIN_DB_USER:-main}
      DB_PASSWORD: ${MAIN_DB_PASSWORD:-main}
      STATS_SERVER_URL: http://stats-server:9090
    depends_on:
      main-db:
        condition: service_healthy
      stats-server:
        condition: service_started

  stats-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ${DB_NAME:-stats}
      POSTGRES_USER: ${DB_USER:-stats}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stats}
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  stats-server:
    build:
      context: .
      dockerfile: ewm-stats-service/ewm-stats-server/Dockerfile
    ports:
      - "${STATS_PORT:-9090}:9090"
    environment:
      SERVER_PORT: 9090
      DB_HOST: stats-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-stats}
      DB_USER: ${DB_USER:-stats}
      DB_PASSWORD: ${DB_PASSWORD:-stats}
    depends_on:
      stats-db:
        condition: service_healthy

volumes:
  main-db-data:
  stats-db-data:
