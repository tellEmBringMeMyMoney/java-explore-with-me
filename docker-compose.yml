services:
  stats-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ${DB_NAME:-stats}
      POSTGRES_USER: ${DB_USER:-stats}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stats}
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  stats-server:
    build:
      context: .
      dockerfile: ewm-stats-service/ewm-stats-server/Dockerfile
    ports:
      - "${STATS_PORT:-9090}:9090"
    environment:
      SERVER_PORT: 9090
      DB_HOST: stats-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-stats}
      DB_USER: ${DB_USER:-stats}
      DB_PASSWORD: ${DB_PASSWORD:-stats}
    depends_on:
      stats-db:
        condition: service_healthy

volumes:
  stats-db-data:
